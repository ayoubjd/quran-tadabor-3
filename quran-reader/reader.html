<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>قارئ الكتاب - تدبر القرآن</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d2818">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Kufi+Arabic:wght@400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/reader.css">
</head>

<body>
    <!-- Top toolbar -->
    <header id="readerToolbar" class="reader-toolbar">
        <button id="btnBack" class="icon-btn" aria-label="العودة للمكتبة">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </button>

        <div class="toolbar-center">
            <h1 id="bookTitle">الكتاب</h1>
            <div class="page-indicator">
                <span id="currentPage">1</span> / <span id="totalPages">0</span>
            </div>
        </div>

        <div class="toolbar-actions" style="display: flex; gap: 0.2rem; align-items: center;">
            <button id="btnZoomOut" class="icon-btn hidden-mobile" aria-label="تصغير">
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    <line x1="8" y1="11" x2="14" y2="11"></line>
                </svg>
            </button>
            <button id="btnZoomIn" class="icon-btn hidden-mobile" aria-label="تكبير">
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    <line x1="11" y1="8" x2="11" y2="14"></line>
                    <line x1="8" y1="11" x2="14" y2="11"></line>
                </svg>
            </button>
            <button id="btnFullscreen" class="icon-btn" aria-label="ملء الشاشة">
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none">
                    <path
                        d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3">
                    </path>
                </svg>
            </button>
            <button id="btnSurahIndex" class="icon-btn" aria-label="فهرس السور" title="فهرس سور القرآن الكريم"
                style="display: none;">
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none">
                    <line x1="8" y1="6" x2="21" y2="6"></line>
                    <line x1="8" y1="12" x2="21" y2="12"></line>
                    <line x1="8" y1="18" x2="21" y2="18"></line>
                    <line x1="3" y1="6" x2="3.01" y2="6"></line>
                    <line x1="3" y1="12" x2="3.01" y2="12"></line>
                    <line x1="3" y1="18" x2="3.01" y2="18"></line>
                </svg>
            </button>
            <button id="btnSurahIndex" class="icon-btn" aria-label="فهرس السور" title="فهرس سور القرآن الكريم"
                style="display: none;">
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none">
                    <line x1="8" y1="6" x2="21" y2="6"></line>
                    <line x1="8" y1="12" x2="21" y2="12"></line>
                    <line x1="8" y1="18" x2="21" y2="18"></line>
                    <line x1="3" y1="6" x2="3.01" y2="6"></line>
                    <line x1="3" y1="12" x2="3.01" y2="12"></line>
                    <line x1="3" y1="18" x2="3.01" y2="18"></line>
                </svg>
            </button>
            <button id="btnSaveReadMark" class="icon-btn" aria-label="حفظ موضع القراءة" title="حفظ موضع القراءة الحالي">
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none">
                    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                    <circle cx="12" cy="11" r="2" fill="currentColor"></circle>
                </svg>
            </button>
            <button id="btnBookmarks" class="icon-btn" aria-label="العلامات المرجعية" title="قائمة العلامات">
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none"
                    stroke-linejoin="round" stroke-linecap="round">
                    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                </svg>
            </button>
        </div>
    </header>

    <!-- Reading Area: horizontal scrolling container -->
    <main id="readerContainer" class="reader-container">
        <!-- Pages will be injected dynamically -->
    </main>

    <!-- Overlay navigation buttons (visible on hover/desktop) -->
    <button id="btnPrevPage" class="nav-btn nav-btn-right" aria-label="الصفحة السابقة">
        <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="2" fill="none">
            <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
    </button>
    <button id="btnNextPage" class="nav-btn nav-btn-left" aria-label="الصفحة التالية">
        <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="2" fill="none">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
    </button>

    <!-- Bookmarks Drawer Modal -->
    <div id="bookmarksModal" class="modal-overlay hidden">
        <div class="modal-content drawer">
            <header class="modal-header">
                <h2>العلامات المرجعية</h2>
                <button id="btnCloseBookmarks" class="icon-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </header>

            <div class="modal-body">
                <!-- Zoom controls for mobile -->
                <div class="zoom-controls-mobile">
                    <button id="btnZoomOutMobile" class="btn-zoom-mob" aria-label="تصغير">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2"
                            fill="none">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            <line x1="8" y1="11" x2="14" y2="11"></line>
                        </svg>
                        تصغير
                    </button>
                    <span id="zoomLevelDisplay" style="font-size:0.85rem;color:var(--text-secondary);">100%</span>
                    <button id="btnZoomInMobile" class="btn-zoom-mob" aria-label="تكبير">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2"
                            fill="none">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            <line x1="11" y1="8" x2="11" y2="14"></line>
                            <line x1="8" y1="11" x2="14" y2="11"></line>
                        </svg>
                        تكبير
                    </button>
                </div>
                <form id="addBookmarkForm" class="add-bookmark-form">
                    <input type="text" id="bookmarkNameInput" placeholder="اسم العلامة (مثل: بداية سورة البقرة)...">
                    <button type="submit" class="btn-primary">حفظ الصفحة الحالية</button>
                </form>

                <div class="bookmarks-list" id="bookmarksList">
                    <!-- Bookmarks will go here -->
                </div>

                <div style="padding-top: 1rem; margin-top: 1rem; border-top: 1px solid var(--brand-border);">
                    <button class="btn-primary" style="width: 100%;" id="btnBottomCloseBookmarks">إغلاق</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Surahs Index Modal (Drawer) -->
    <div id="surahIndexModal" class="modal-overlay hidden">
        <div class="modal-content drawer-bottom">
            <header class="modal-header">
                <h2>فهرس سور القرآن</h2>
                <button class="icon-btn btn-close" id="btnCloseSurahIndex" aria-label="إغلاق">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </header>

            <div class="modal-body" style="display: flex; flex-direction: column; overflow: hidden; max-height: 80vh;">
                <div class="search-container" style="padding: 1rem; border-bottom: 1px solid var(--brand-border);">
                    <input type="text" id="surahSearchInput" placeholder="ابحث باسم أو رقم السورة..."
                        class="surah-search-input">
                </div>
                <div style="flex: 1; overflow-y: auto; padding-bottom: 1rem;">
                    <ul id="surahList" class="surah-list">
                        <!-- Surahs will be injected here via JS -->
                    </ul>
                </div>
                <div style="padding: 1rem; border-top: 1px solid var(--brand-border);">
                    <button class="btn-primary" style="width: 100%;" id="btnBottomCloseSurahs">إغلاق</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Script dependencies -->
    <script src="js/books.js"></script>
    <script src="js/surahs.js"></script>
    <script src="js/db.js"></script>
    <script src="js/bookmarks.js"></script>
    <script src="js/reader.js"></script>
</body>

</html>
